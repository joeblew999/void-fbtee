# void-fbtee as a developer receives it (e2e/fresh/check.ts): packed, checked as Void checks its own
# packages, installed into fresh `void init` apps with npm and pnpm, on Vite+ and plain Vite, plus
# the git install. When what it covers changes, as voidzero-dev/void runs its packed-install tests,
# and weekly, since new apps get the latest Void, Vite+, Vite, npm and pnpm without this repo changing.
name: Fresh install

on:
  push:
    branches: [main]
    paths: &paths
      - packages/void-fbtee/**
      - package.json
      - apps/example/package.json
      - apps/example/i18n/**
      - pnpm-workspace.yaml
      - .node-version
      - e2e/fresh/**
      - .github/workflows/fresh.yml
      - .github/actions/setup/**
  pull_request:
    branches: [main]
    paths: *paths
  schedule:
    # Mondays, 05:17 UTC.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: fresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fresh:
    name: fresh install (${{ matrix.app }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: [pnpm-vite-plus, npm-vite-plus, pnpm-vite, npm-vite, git]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: vp run test:fresh ${{ matrix.app }}
