# void-fbtee installed into fresh `void init` apps (Vite+ and plain Vite), as a user's app installs
# it. Only when what it covers changes, as voidzero-dev/void runs its full packed-install tests:
# the package, the manifests, the versions, and the check itself.
name: Fresh install

on:
  push:
    branches: [main]
    paths: &paths
      - packages/void-fbtee/**
      - package.json
      - apps/example/package.json
      - apps/example/i18n/**
      - pnpm-workspace.yaml
      - .node-version
      - e2e/fresh/**
      - .github/workflows/fresh.yml
  pull_request:
    branches: [main]
    paths: *paths

permissions: {}

concurrency:
  group: fresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fresh:
    name: fresh install (Vite+ and plain Vite)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          # No lockfiles in this repo, so the install mustn't insist on one (it does in CI by default).
          run-install: |
            - args: ["--no-frozen-lockfile"]
      - run: vp run test:fresh
