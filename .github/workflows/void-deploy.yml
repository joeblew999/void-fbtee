# Void's deploy workflow (`void init --github` writes it for a single app; for an app in a
# workspace it leaves it to the repo root): deploy the example to Cloudflare on each push to main.
# Vite+'s setup-vp in place of separate pnpm and Node steps, and the example's deploy task, which
# builds void-fbtee first. Needs the CLOUDFLARE_API_TOKEN repository secret.
name: Deploy to Cloudflare
on:
  push:
    branches: [main]

concurrency:
  group: void-cloudflare-deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          # No lockfiles in this repo, so the install mustn't insist on one (it does in CI by default).
          run-install: |
            - args: ["--no-frozen-lockfile"]
      - name: Deploy
        env:
          # Add this scoped token at Settings → Secrets and variables → Actions.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Account subdomain for workers.dev readiness when a version has no preview URL.
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
        run: vp run deploy
