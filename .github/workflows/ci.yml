# Vite+'s own CI setup (https://viteplus.dev/guide/ci): setup-vp installs vp, the Node in
# .node-version and the pnpm in package.json, then vp install. No Cloudflare credentials: Cloudflare's
# Workers Builds builds and deploys each push itself (main as production, other branches as Worker
# Previews), and a quick check runs against what it deployed (vp run test:deployed).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: check and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read # Cloudflare's "Workers Builds" check on the commit
    env:
      CLOUDFLARE_WORKERS_SUBDOMAIN: gedw99
      GH_TOKEN: ${{ github.token }} # gh, for the check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          # No lockfiles in this repo, so the install mustn't insist on one (it does in CI by default).
          run-install: |
            - args: ["--no-frozen-lockfile"]
      - run: vp run install:browser
      - run: vp check
      - run: vp run check:tools
      - run: vp test run --project void-fbtee
      - run: vp run example#test
      - run: vp run test:deployed

  # A release when packages/void-fbtee/package.json has a version with no tag yet: the tag and the
  # GitHub release (notes written by GitHub from the commits). Apps pin it in their dependency:
  # github:joeblew999/void-fbtee#v<version>&path:/packages/void-fbtee
  release:
    name: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release the package's version, if it's new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version packages/void-fbtee/package.json)
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already released"
          else
            gh release create "v$version" --target "$GITHUB_SHA" --generate-notes --title "v$version"
          fi
