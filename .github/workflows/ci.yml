# Vite+'s own CI setup (https://viteplus.dev/guide/ci), in .github/actions/setup: setup-vp installs
# vp, the Node in .node-version and the pnpm in package.json, then vp install; then check, test,
# build, as that guide runs them. Then, for a push to main, Void's own
# way of deploying from GitHub (Void's guide/deployment.md, "Deploy from GitHub", and the workflow
# `void init --github` writes): the same `vp run deploy` as on your machine, with a Cloudflare API
# token from the repository's secrets, then the quick live check (`vp run test:deployed`).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: check and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: vp run install:browser
      - run: vp check
      - run: vp run check:tools
      - run: vp run test:unit
      # Vite+'s CI guide's last step, `vp build`; at a workspace root it's every package's build
      # (vite-plus/docs/guide/monorepo.md): void-fbtee packed, the example built. So a change that
      # breaks the build fails here, in a pull request too, not first at deploy.
      - run: vp run -r build

  # The deploy, once the checks pass: only for main, one at a time (a newer push waits).
  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      # The repository secret (README): Workers Scripts, D1, KV, R2 and Queues.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 7384af54e33b8a54ff240371ea368440
      # The account's workers.dev subdomain, for Void's readiness check of the new version.
      CLOUDFLARE_WORKERS_SUBDOMAIN: gedw99
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: vp run install:browser
      - run: vp run deploy
      - run: vp run test:deployed

  # A release when packages/void-fbtee/package.json has a version with no tag yet: the tag and the
  # GitHub release (notes written by GitHub from the commits). Apps pin it in their dependency:
  # github:joeblew999/void-fbtee#v<version>&path:/packages/void-fbtee
  release:
    name: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release the package's version, if it's new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version packages/void-fbtee/package.json)
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already released"
          else
            gh release create "v$version" --target "$GITHUB_SHA" --generate-notes --title "v$version"
          fi
