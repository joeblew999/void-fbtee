# What every CI job that runs the repo's tasks starts with, after the checkout (a local action is
# read from the checked-out repo): Vite+, with the Node in .node-version, and the packages.
name: setup
description: Vite+ and the packages
runs:
  using: composite
  steps:
    - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      with:
        node-version-file: .node-version
        # No lockfiles in this repo, so the install mustn't insist on one (it does in CI by default).
        run-install: |
          - args: ["--no-frozen-lockfile"]
