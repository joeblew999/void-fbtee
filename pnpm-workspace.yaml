packages:
  - packages/*
  - apps/*

allowBuilds:
  better-sqlite3: false
  esbuild: true
  sharp: true
  workerd: true

# vp manages Node (.node-version) and pnpm (package.json); stop pnpm from switching versions itself.
runtimeOnFail: ignore
pmOnFail: ignore

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
# One version each, for every workspace package: Vite+ (kept by `vp migrate`) and Void.
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
  void: 1.8.0
  "@void/md": 1.8.0
  "@void/react": 1.8.0
  vitest: 5.1.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
permissions:
  fbtee:
    skills: false
  void:
    skills: false
