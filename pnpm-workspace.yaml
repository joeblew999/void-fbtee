packages:
  - packages/*
  - apps/*

allowBuilds:
  better-sqlite3: false
  esbuild: true
  sharp: true
  workerd: true

# mise manages Node and pnpm; stop pnpm from switching versions itself.
runtimeOnFail: ignore
pmOnFail: ignore

overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.5.1
minimumReleaseAgeExclude:
  - '@voidzero-dev/vite-plus-core@1.5.1'
  - '@voidzero-dev/vite-plus-darwin-arm64@1.5.1'
  - '@voidzero-dev/vite-plus-darwin-x64@1.5.1'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@1.5.1'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@1.5.1'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@1.5.1'
  - '@voidzero-dev/vite-plus-linux-x64-musl@1.5.1'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@1.5.1'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@1.5.1'
  - vite-plus@1.5.1
