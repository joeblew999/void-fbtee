packages:
  - packages/*
  - apps/*

allowBuilds:
  better-sqlite3: false
  esbuild: true
  sharp: true
  workerd: true

# vp manages Node (.node-version) and pnpm (package.json); stop pnpm from switching versions itself.
runtimeOnFail: ignore
pmOnFail: ignore

overrides:
  vite@*: "catalog:"
# One version each, for every workspace package: Vite+ (kept by `vp migrate`) and Void.
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.5.1
  vite-plus: 1.5.1
  void: 1.7.0
  "@void/md": 1.7.0
  "@void/react": 1.7.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
