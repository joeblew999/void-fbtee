packages:
  - packages/*
  - apps/*

allowBuilds:
  better-sqlite3: false
  esbuild: true
  sharp: true
  workerd: true

# vp manages Node (.node-version) and pnpm (package.json); stop pnpm from switching versions itself.
runtimeOnFail: ignore
pmOnFail: ignore

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
  # Void 1.8.0 takes these by range, and their release candidates (2026-11-16/17) break it: the
  # Cloudflare plugin's rc writes its build where Void 1.8.0 can't read it (README "Reported to
  # Void"), and the cf CLI's is untested here. They go with the Void upgrade (plans/void-upgrade.md).
  "@cloudflare/vite-plugin": 2.0.0-beta.v.17
  cf: 1.0.0-beta.32
# One version each, for every workspace package: Vite+ (kept by `vp migrate`) and Void.
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
  void: 1.8.0
  # Cloudflare's Worker types, at the version Void 1.8.0's lockfile entry resolves: loaded in
  # void-fbtee's own build, so D1's results (D1Result) are typed there as they are in an app.
  "@cloudflare/workers-types": 5.20261117.1
  "@void/md": 1.8.0
  "@void/react": 1.8.0
  vitest: 5.1.0
  # Hono's types, at the version Void 1.8.0 resolves (its range ^4.13.18): void-fbtee's build types
  # Hono's route helper with them (src/virtual.d.ts), and the code uses Void's own copy at run time.
  hono: 4.13.19
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
permissions:
  fbtee:
    skills: false
  void:
    skills: false
